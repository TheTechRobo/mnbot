services:
  server:
    build: .
    command: "tracker.server"
    environment:
      H2IBOT_GET_URL: ${H2IBOT_GET_URL}
      H2IBOT_POST_URL: ${H2IBOT_POST_URL}
      MNBOT_DATABASE_URI: ${MNBOT_DATABASE_URI}
      TRACKER_BASE_URL: ${TRACKER_BASE_URL}
      INFO_URL: ${INFO_URL}
      LISTEN_HOST: ${LISTEN_HOST}
    restart: always
    init: true
    #ports:
    #  - 8897:8897
    network_mode: host
  bot:
    build: .
    command: "tracker.irc"
    environment:
      H2IBOT_GET_URL: ${H2IBOT_GET_URL}
      H2IBOT_POST_URL: ${H2IBOT_POST_URL}
      MNBOT_DATABASE_URI: ${MNBOT_DATABASE_URI}
      TRACKER_BASE_URL: ${TRACKER_BASE_URL}
      DOCUMENTATION_URL: ${DOCUMENTATION_URL}
    restart: always
    init: true
    network_mode: host
  dashboard:
    build: .
    entrypoint: "hypercorn -b ${LISTEN_HOST}:8898"
    command: "tracker.dashboard.__main__:app"
    restart: always
    init: true
    environment:
      DOCUMENTATION_URL: ${DOCUMENTATION_URL}
      MNBOT_DATABASE_URI: ${MNBOT_DATABASE_URI}
    #ports:
    #  - 8898:8898
    network_mode: host
